<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">MSEDCL solar bill reading guide</title><desc id="desc">A sample solar bill layout highlights import units, export units, generation, offset and billed units as separate fields to compare.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14231e"/><stop offset="1" stop-color="#09110f"/></linearGradient></defs><rect width="1200" height="680" fill="url(#bg)"/><circle cx="1050" cy="90" r="90" fill="#e8b957" opacity=".08"/>
<text x="66" y="77" fill="#9be2ae" font-family="Arial,sans-serif" font-size="18" letter-spacing="3">MSEDCL SOLAR BILL · QUICK MAP</text><text x="66" y="121" fill="#edf5f0" font-family="Arial,sans-serif" font-size="31" font-weight="700">Read the energy lines separately</text>
<rect x="66" y="164" width="700" height="420" rx="18" fill="#f6f7f3"/><text x="103" y="210" fill="#25332d" font-family="Arial,sans-serif" font-size="18" font-weight="700">SOLAR NET METER CONSUMPTION DETAILS</text>
<path d="M102 235h626" stroke="#c7d0ca" stroke-width="2"/><text x="103" y="275" fill="#526159" font-family="Arial,sans-serif" font-size="14">TARIFF PERIOD</text><text x="315" y="275" fill="#526159" font-family="Arial,sans-serif" font-size="14">IMPORT UNITS</text><text x="479" y="275" fill="#526159" font-family="Arial,sans-serif" font-size="14">EXPORT UNITS</text><text x="641" y="275" fill="#526159" font-family="Arial,sans-serif" font-size="14">GENERATION</text>
<g font-family="Arial,sans-serif" font-size="16" fill="#26362e"><text x="103" y="322">00:00–06:00</text><text x="335" y="322">Current − previous</text><text x="516" y="322">Current − previous</text><text x="668" y="322">Reading</text><text x="103" y="369">06:00–09:00</text><text x="335" y="369">+ adjustment</text><text x="516" y="369">+ adjustment</text><text x="668" y="369">(separate meter)</text><text x="103" y="416">09:00–17:00</text><text x="103" y="463">17:00–24:00</text></g>
<path d="M98 297h636M98 344h636M98 391h636M98 438h636M98 485h636" stroke="#d8dfd9" stroke-width="1"/>
<rect x="99" y="504" width="633" height="53" rx="8" fill="#e4f3e9"/><text x="119" y="537" fill="#236b46" font-family="Arial,sans-serif" font-size="17" font-weight="700">Then check: OFFSET · BANKED UNITS · BILLED UNITS</text>
<g font-family="Arial,sans-serif"><rect x="823" y="186" width="300" height="93" rx="14" fill="#172b23" stroke="#56a875" stroke-width="2"/><text x="850" y="223" fill="#9be2ae" font-size="15" letter-spacing="1">ENERGY FROM GRID</text><text x="850" y="254" fill="#edf5f0" font-size="23" font-weight="700">IMPORT</text>
<rect x="823" y="307" width="300" height="93" rx="14" fill="#172b23" stroke="#56a875" stroke-width="2"/><text x="850" y="344" fill="#9be2ae" font-size="15" letter-spacing="1">ENERGY TO GRID</text><text x="850" y="375" fill="#edf5f0" font-size="23" font-weight="700">EXPORT</text>
<rect x="823" y="428" width="300" height="93" rx="14" fill="#172b23" stroke="#e8b957" stroke-width="2"/><text x="850" y="465" fill="#e8b957" font-size="15" letter-spacing="1">ENERGY MADE ON SITE</text><text x="850" y="496" fill="#edf5f0" font-size="23" font-weight="700">GENERATION</text></g>
<path d="M770 324h35m-35 120h35" stroke="#e8b957" stroke-width="3"/><text x="66" y="632" fill="#93a59b" font-family="Arial,sans-serif" font-size="14">Field labels follow MSEDCL's published LTIP solar bill format. Layout can change; verify your own bill period and meter details.</text></svg>
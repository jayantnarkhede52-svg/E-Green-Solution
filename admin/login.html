<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6RB8MHEG1S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-6RB8MHEG1S');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Egreen Solution</title>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2e7d32;
            --secondary: #fbc02d;
            --dark: #121212;
            --surface: #1e1e1e;
            --text: #ffffff;
            --text-dim: #b0b0b0;
            --danger: #ff5252;
            --success: #4caf50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--dark); color: var(--text); overflow-x: hidden; }

        /* Login Overlay */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; z-index: 10000;
        }
        .login-card {
            background: var(--surface); padding: 40px; border-radius: 24px;
            width: 100%; max-width: 400px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .login-card h2 { margin-bottom: 24px; font-weight: 800; }
        .login-card input {
            width: 100%; padding: 14px; margin-bottom: 20px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: #fff; font-size: 16px; outline: none;
        }
        .login-card button {
            width: 100%; padding: 14px; background: var(--secondary);
            border: none; border-radius: 12px; color: #000; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }
        .login-card button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(251, 192, 45, 0.4); }

        /* Dashboard Layout */
        header { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo img { height: 40px; }
        .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 8px 20px; border-radius: 8px; cursor: pointer; }

        main { padding: 40px 5%; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--surface); padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-card h3 { font-size: 14px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }
        .stat-card p { font-size: 32px; font-weight: 800; color: var(--secondary); }

        .table-container { background: var(--surface); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 20px; background: rgba(255,255,255,0.03); color: var(--text-dim); font-weight: 600; font-size: 14px; }
        td { padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 15px; }
        tr:hover { background: rgba(255,255,255,0.02); }

        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge.new { background: rgba(46, 125, 50, 0.2); color: #81c784; }
        .badge.contacted { background: rgba(251, 192, 45, 0.2); color: #fff176; }

        .actions { display: flex; gap: 10px; }
        .action-btn { background: rgba(255,255,255,0.05); border: none; padding: 8px; border-radius: 8px; color: #fff; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: rgba(255,255,255,0.1); color: var(--secondary); }
        .action-btn.delete:hover { color: var(--danger); }

        @media (max-width: 768px) {
            th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5) { display: none; }
        }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-card">
            <img src="/assets/logo.png" style="height: 50px; margin-bottom: 20px;">
            <h2>Admin Login</h2>
            <input type="password" id="admin-pass" placeholder="Enter Admin Password">
            <button onclick="checkAuth()">Access Dashboard</button>
            <p id="login-error" style="color: var(--danger); font-size: 14px; margin-top: 15px; display: none;">Invalid Password</p>
        </div>
    </div>

    <div id="dashboard" style="display: none;">
        <header>
            <div class="logo"><img src="/assets/logo.png" alt="Egreen Solution"></div>
            <div>
                <span id="user-display" style="margin-right: 20px; color: var(--text-dim);">Admin Portal</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <main>
            <div class="stats">
                <div class="stat-card" style="position: relative;">
                    <h3>Total Leads</h3>
                    <p id="stat-total">0</p>
                    <button onclick="clearAllLeads()" style="position: absolute; top: 15px; right: 15px; background: rgba(255,82,82,0.1); border: 1px solid var(--danger); color: var(--danger); padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer;">Clear All</button>
                </div>
                <div class="stat-card">
                    <h3>New Leads</h3>
                    <p id="stat-new">0</p>
                </div>
                <div class="stat-card">
                    <h3>Contacted</h3>
                    <p id="stat-contacted">0</p>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Full Name</th>
                            <th>Phone</th>
                            <th>City</th>
                            <th>Message</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body">
                        <!-- Leads will be injected here -->
                        <tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-dim);">Loading leads...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/js/supabase-config.js"></script>
    <script>
        // Use the password you provided
        const ADMIN_HASH = "Egreensolution@2026"; 

        function checkAuth() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_HASH) {
                localStorage.setItem('admin_auth', 'true');
                showDashboard();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function showDashboard() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            fetchLeads();
        }

        function logout() {
            localStorage.removeItem('admin_auth');
            location.reload();
        }

        // Auto-login if already authenticated
        if (localStorage.getItem('admin_auth') === 'true') {
            showDashboard();
        }

        async function fetchLeads() {
            const { data, error } = await _supabase
                .from('leads')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching leads:', error);
                return;
            }

            renderLeads(data);
            updateStats(data);
        }

        function renderLeads(leads) {
            const body = document.getElementById('leads-body');
            if (leads.length === 0) {
                body.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-dim);">No leads found.</td></tr>';
                return;
            }

            body.innerHTML = leads.map(lead => `
                <tr id="lead-${lead.id}">
                    <td>${new Date(lead.created_at).toLocaleDateString()}</td>
                    <td style="font-weight: 600;">${lead.full_name}</td>
                    <td><a href="tel:${lead.phone}" style="color: var(--secondary); text-decoration: none;">${lead.phone}</a></td>
                    <td>${lead.city}</td>
                    <td style="max-width:300px; font-size: 13px; color: var(--text-dim);">${lead.message || '-'}</td>
                    <td><span class="badge ${lead.status.toLowerCase()}">${lead.status}</span></td>
                    <td class="actions">
                        <button class="action-btn" title="Mark as Contacted" onclick="updateStatus('${lead.id}', 'Contacted')">
                            <i class="fas fa-check"></i>
                        </button>
                        <button class="action-btn delete" title="Delete Lead" onclick="deleteLead('${lead.id}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(leads) {
            document.getElementById('stat-total').innerText = leads.length;
            document.getElementById('stat-new').innerText = leads.filter(l => l.status === 'New').length;
            document.getElementById('stat-contacted').innerText = leads.filter(l => l.status === 'Contacted').length;
        }

        async function updateStatus(id, status) {
            const { error } = await _supabase
                .from('leads')
                .update({ status: status })
                .eq('id', id);

            if (error) alert('Error updating status');
            else fetchLeads();
        }

        async function deleteLead(id) {
            if (!confirm('Are you sure you want to delete this lead?')) return;
            
            const { error } = await _supabase
                .from('leads')
                .delete()
                .eq('id', id);

            if (error) alert('Error deleting lead');
            else fetchLeads();
        }

        async function clearAllLeads() {
            if (!confirm('⚠️ DANGER: This will PERMANENTLY delete ALL leads from the database. Are you sure?')) return;
            if (!confirm('FINAL CONFIRMATION: This cannot be undone. Delete everything?')) return;

            const { error } = await _supabase
                .from('leads')
                .delete()
                .neq('id', 0); // Deletes all rows where ID is not 0

            if (error) {
                console.error('Error clearing database:', error);
                alert('Error clearing leads: ' + error.message);
            } else {
                alert('Database cleared successfully!');
                fetchLeads();
            }
        }
    </script>
</body>
</html>
